    <div class="matrix-background"></div>

    <div class="terminal-falso">
        <div class="terminal-barra-titulo">Prompt de Comando</div>
        <div class="terminal-conteudo">
            <p><span class="terminal-prompt">user@linux:~$</span> <span id="typing-command"></span><span id="blinking-bar" class="blinking-cursor">|</span></p>
            <p><span id="typing-output"></span></p>
            <p><span id="final-cursor" class="blinking-cursor">_</span></p>
        </div>
    </div>

    <div class="capa-container">
        <h1>4° Comando: Cat</h1>
        <h2>Comando cat</h2>
        <p>
            O cat (abreviação para concatenar) é um dos comandos Linux mais usados. Ele é usado para visualizar, criar e relacionar arquivos. Para executar esse comando, digite cat seguido pelo nome do arquivo e sua extensão.
        </p>
